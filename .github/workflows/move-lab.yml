name: Move Lab

# Builds the battle engine for the browser, checks that blocks and Lua agree, and builds the site.
# Pushes to main are also published to Cloudflare once the repository has the
# CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN secrets (see move-lab/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'move-lab/**'
      - 'crates/**'
      - 'moves/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/move-lab.yml'
  pull_request:
    paths:
      - 'move-lab/**'
      - 'crates/**'
      - 'moves/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/move-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: move-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: move-lab
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: move-lab/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: move-lab/engine-wasm

      - name: Read the pinned Emscripten version
        id: emsdk
        run: echo "version=$(tr -d '[:space:]' < emsdk-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: move-lab/.emsdk
          key: emsdk-${{ runner.os }}-${{ steps.emsdk.outputs.version }}

      - name: Install Emscripten
        run: npm run setup:emsdk

      - name: Install packages
        run: npm ci

      - name: Build the engine for the browser
        run: npm run build:engine

      - name: Test the engine and the blocks
        run: npm test

      - name: Build the site
        run: npm run build

      - name: Keep the built site
        uses: actions/upload-artifact@v7
        with:
          name: move-lab
          path: move-lab/dist
          if-no-files-found: error

  deploy:
    name: Publish to Cloudflare
    # Only main is published.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A job cannot be skipped based on secrets, so look here and stop quietly if they are missing.
      - name: Check that Cloudflare is configured
        id: cloudflare
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$ACCOUNT" ] && [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not published. Add the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN secrets to publish main."
          fi

      # For move-lab/wrangler.jsonc; the site itself comes from the build job.
      - uses: actions/checkout@v7
        if: steps.cloudflare.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Fetch the built site
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: move-lab
          path: move-lab/dist

      - name: Publish
        if: steps.cloudflare.outputs.ready == 'true'
        working-directory: move-lab
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
